# Bind to loopback so the stack remains on the host-only network
bind 127.0.0.1
protected-mode yes
port 6379

# Persistence
save 900 1
save 300 10
save 60 10000
dir /data

# Memory policy
maxmemory 1gb
maxmemory-policy noeviction

# Logging
loglevel notice

# Redis password is supplied via docker-compose using REDIS_PASSWORD
# and the command line option --requirepass.
