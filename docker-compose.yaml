name: livekit-core

services:
  redis:
    image: redis:7-alpine
    container_name: livekit-redis
    command: sh -c 'redis-server /etc/redis.conf --requirepass "$${REDIS_PASSWORD}"'
    restart: unless-stopped
    network_mode: host
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./redis.conf:/etc/redis.conf:ro
      - ./redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.13
    container_name: livekit-server
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host
    environment:
      - "LIVEKIT_KEYS=${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  livekit-service:
    image: hs5mne/rama-livekit-service:v1.0.0-uat
    container_name: rama-livekit-service
    restart: unless-stopped
    pull_policy: always
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8081}
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "bun -e 'fetch(\"http://localhost:${PORT:-8081}/health-check\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
